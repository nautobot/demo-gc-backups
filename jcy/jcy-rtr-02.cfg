interface Loopback0
 description Connection to loopback
 ip address 10.0.10.2 255.255.255.255
 ip ospf 1 area 0.0.0.0
!
interface Loopback99
 description Management Loopback
 ip address 172.18.0.11 255.255.255.255
!
interface GigabitEthernet1
 description MANAGEMENT_DO_NOT_CHANGE
 ip address 10.0.0.15 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 description Connection to bb-01
 ip address 10.10.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet4
 description Connection to rtr-01
 ip address 10.10.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet5
 description Connection to spine-02
 ip address 10.10.11.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
router ospf 1
 router-id 10.0.10.2
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
