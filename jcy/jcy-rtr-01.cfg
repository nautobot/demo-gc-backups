!
interface Loopback0
 description Connection to loopback
 ip address 10.0.10.1 255.255.255.255
 ip ospf 1 area 0.0.0.0
!
interface Loopback99
 description Management Loopback
 ip address 172.18.0.10 255.255.255.255
!
interface GigabitEthernet1
 description MANAGEMENT_DO_NOT_CHANGE
 ip address 10.0.0.15 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 description Connection to bb-01
 ip address 10.10.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet4
 description Connection to rtr-02
 ip address 10.10.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet5
 description Connection to spine-01
 ip address 10.10.11.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
router ospf 1
 router-id 10.0.10.1
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
!
!
virtual-service csr_mgmt
!
ip forward-protocol nd
ip http server
ip http authentication local
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
ip scp server enable
!
!
logging origin-id hostname
logging source-interface GigabitEthernet1
logging host 10.125.1.171 transport udp port 7004
