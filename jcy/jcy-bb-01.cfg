!
interface Loopback0
 description Connection to loopback
 ip address 10.0.10.3 255.255.255.255
 ip ospf 1 area 0.0.0.0
!
interface Loopback99
 description Management Loopback
 ip address 172.18.0.12 255.255.255.255
!
interface GigabitEthernet1
 description MANAGEMENT_DO_NOT_CHANGE
 ip address 10.0.0.15 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 description Connection to rtr-01
 ip address 10.10.0.6 255.255.255.252
 ip access-group BLOCK_TRANSIT_LINKS in
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 description Connection to rtr-02
 ip address 10.10.0.14 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet4
 description Connection to uplink
 ip address 10.10.0.17 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0.0.0.0
 negotiation auto
 no mop enabled
 no mop sysid
!
router ospf 1
 router-id 10.0.10.3
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
!
!
virtual-service csr_mgmt
!
ip forward-protocol nd
ip http server
ip http authentication local
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
ip scp server enable
!
!
logging origin-id hostname
logging source-interface GigabitEthernet1
logging host 10.125.1.171 transport udp port 7004
